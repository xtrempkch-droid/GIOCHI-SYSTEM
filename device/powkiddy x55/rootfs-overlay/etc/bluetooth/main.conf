# bluetoothd — configuração do Giochi System
# ============================================================================
# O Buildroot instala o daemon pelo pacote bluez5-utils e NÃO traz este arquivo.
# Sem ele o bluetoothd usa o padrão de compilação, que tem AutoEnable=false: o
# controlador aparece em `bluetoothctl list` mas fica "Powered: no", e quem chega
# no aparelho conclui que o Bluetooth "não funciona" — o rádio está pronto e
# apenas desligado.
#
# Medido no X55: com o firmware carregado (fw version 0x75b8f098), o controlador
# tem MAC real (A8:4F:A4:C9:98:4C) e enxerga outros dispositivos; faltava só
# ligar.
#
# Opções ausentes usam o padrão do BlueZ — este arquivo é só o delta.

[General]
Name = Giochi System
# Classes menores que 0x100 não identificam o aparelho como computador/áudio e
# alguns dispositivos recusam o pareamento.
Class = 0x000104

[Policy]
# Liga o rádio assim que o bluetoothd sobe.
AutoEnable = true
