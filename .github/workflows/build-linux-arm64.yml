name: Build Giochi System ARM64

on:
  push:
    branches: [main]
    paths:
      - "buildroot.version"
      - "config/**"
      - "device/**"
      - "scripts/**"
      - ".github/workflows/build-linux-arm64.yml"
  workflow_dispatch:
    inputs:
      device:
        description: "ID do device ou 'all'"
        required: false
        default: "all"
        type: string
      arch:
        description: "Arquitetura alvo (arm64, x86_64 ou arm)"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
          - arm
      buildroot_version:
        description: "Versão Buildroot (vazio usa buildroot.version)"
        required: false
        default: ""
        type: string
      publicar_release:
        description: "Publicar as imagens numa Release (link permanente, sem login, não expira em 14 dias)."
        required: false
        default: "false"
        # `choice` pelo mesmo motivo do `allow_draft`: `github.event.inputs.*`
        # chega como STRING, e comparar string com booleano em expressão do
        # Actions faz coerção numérica — "true" == true dá falso (§12.5).
        type: choice
        options:
          - "false"
          - "true"
      allow_draft:
        description: "Construir rascunho (ex.: powkiddy-x55). Só vale com device=<id>, nunca com all."
        required: false
        default: "false"
        # `choice`, e não `boolean`: `github.event.inputs.*` chega como STRING, e
        # comparar string com booleano em expressão do Actions faz coerção
        # numérica — "true" == true dá falso. Foi o que manteve o allow_draft
        # desligado e derrubou o discover com "Dispositivo desabilitado".
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  # cancel-in-progress: true — um push novo cancela o build em andamento em vez
  # de enfileirar. Com `false`, cada commit em device/ ou config/ dispara um
  # build de 3-4 h que espera o anterior terminar: a fila nunca esvazia e só o
  # último é útil. Medido em 02/11/2026: 6 builds enfileirados, nenhum com cache.
  group: giochi-system-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate device tree
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate devices
        run: node scripts/validate-devices.mjs

      - name: Run tests
        run: node tests/run-all.mjs

  discover:
    name: Discover build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build matrix
        id: matrix
        env:
          REQUESTED_DEVICE: ${{ github.event.inputs.device || 'all' }}
          REQUESTED_ARCH: ${{ github.event.inputs.arch || 'arm64' }}
          # Rascunho só entra na matriz se declarar defconfig — quem garante
          # isso é o list-devices, não este YAML.
          ALLOW_DRAFT: ${{ github.event.inputs.allow_draft == 'true' && '1' || '0' }}
        run: |
          node scripts/validate-devices.mjs
          MATRIX="$(node scripts/list-devices.mjs --github-matrix --device "$REQUESTED_DEVICE" --arch "$REQUESTED_ARCH")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matriz de build: $MATRIX"

  build:
    name: Build ${{ matrix.device }}
    needs: [validate, discover]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      GIOCHI_SYSTEM_CACHE_DIR: ${{ github.workspace }}/.cache
      GIOCHI_SYSTEM_WORK_DIR: ${{ github.workspace }}/work
      GIOCHI_SYSTEM_CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      # O `build-device.sh` recusa device desabilitado sem isto. Mesmo valor do
      # `discover`: só entra rascunho que declarou defconfig.
      ALLOW_DRAFT: ${{ github.event.inputs.allow_draft == 'true' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Free disk space
        run: |
          # O runner traz ~20-25 GB de SDKs que este build não usa. Sem liberar,
          # o disco enche no meio do build (que roda 1-3 h) e ele morre sem
          # mensagem que explique a causa.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Resolve Buildroot version
        run: |
          VERSION="${{ github.event.inputs.buildroot_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(cat buildroot.version)"
          fi
          echo "BUILDROOT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Usando Buildroot $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential bzip2 ca-certificates \
            cpio curl device-tree-compiler dosfstools e2fsprogs file flex \
            gawk gettext gperf git help2man libelf-dev libncurses-dev libssl-dev \
            libtool libudev-dev mtools parted patch perl pkg-config python3 \
            python3-dev python3-setuptools rsync swig tar texinfo unzip wget \
            xz-utils zlib1g-dev \
            u-boot-tools \
            ccache
          # `gawk` e `zlib1g-dev` estavam na lista do `check-host.sh` e do
          # `docker/builder.Dockerfile` e NÃO aqui. Não quebra hoje porque o
          # runner do ubuntu-24.04 já os traz instalados — mas isso é depender do
          # que a imagem do runner tem, não do que o build precisa, e a falha
          # apareceria no meio de um build de horas com `awk: not found` ou
          # `zlib.h: No such file`. Custa uma linha.

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          # `build-device.sh` usa `$GIOCHI_SYSTEM_CACHE_DIR/dl` para
          # `BR2_DL_DIR`. O caminho `.cache/buildroot-dl` que estava aqui (e
          # nos docs) não é usado por nenhum script: o cache era salvo e
          # restaurado vazio, então TODO build baixava o tarball do Buildroot
          # e todos os pacotes de novo — o oposto do que o `ccache` ganha.
          #
          # E NADA de comentário dentro do `path: |`: ali é bloco literal, e
          # uma linha começando com `#` vira um CAMINHO literal para o
          # `actions/cache` — a explicação entraria na lista de padrões.
          path: |
            .cache/downloads
            .cache/dl
          # Chave ESTÁVEL (sem hashFiles). Com hash de config/device a chave muda
          # a cada commit, então TODO build é frio — baixa o Buildroot e os
          # tarballs de novo. Cache do actions é imutável: chave estável restaura
          # sempre e só salva na primeira vez.
          key: giochi-system-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}
          restore-keys: |
            giochi-system-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}-
            giochi-system-${{ matrix.device }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          # BR2_CCACHE_USE_BASEDIR torna o cache independente do caminho do
          # workspace, então ele acerta entre execuções mesmo com runner novo.
          # Também estável, e pelo mesmo motivo: chave por hash de config/
          # invalidava o ccache a cada ajuste de fragmento, então o build nunca
          # aproveitava objeto compilado. É o erro que o antecessor documentou:
          # "ccache não pagou porque a chave era hashFiles('buildroot/**')".
          key: giochi-ccache-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}
          restore-keys: |
            giochi-ccache-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}-
            giochi-ccache-${{ matrix.device }}-

      - name: Build image
        env:
          GIOCHI_SYSTEM_VERSION: ${{ github.ref_name }}-${{ github.sha }}
          ROOT_PASSWORD: ${{ secrets.GIOCHI_SYSTEM_ROOT_PASSWORD }}
        run: bash scripts/build-device.sh "${{ matrix.device }}"

      - name: Montar a imagem de cartão
        # Só para aparelho que declara firmware de boot em `artifacts`. O alvo
        # virtual (qemu) não tem U-Boot nem layout de partição: o `rootfs.ext4`
        # dele JÁ é o disco, e passar por aqui só produziria erro.
        #
        # Existe porque o build entrega `Image`, `rootfs.ext4`, `idbloader.img`
        # e `u-boot*.bin` SOLTOS: um cartão gravado só com eles não inicializa,
        # já que o BootROM da Rockchip lê o firmware em setores fixos. Quem
        # monta o layout é o `make-sd-image.sh`, e ele precisa de loop device —
        # daí o `sudo`, que o runner do GitHub tem.
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.device }}"
          if node -e '
            const fs = require("node:fs");
            const d = JSON.parse(fs.readFileSync(process.argv[1] + "/device.json", "utf8"));
            const firmware = (d.artifacts || []).some((a) => /idbloader|u-boot/i.test(a));
            process.exit(firmware ? 0 : 1);
          ' "$OUT"; then
            echo "montando a imagem de cartão de ${{ matrix.device }}"
            sudo bash scripts/make-sd-image.sh "${{ matrix.device }}"
            # O dono dos arquivos sai como root: o upload roda como o usuário do
            # runner e não consegue ler o que não é dele.
            sudo chown -R "$(id -u):$(id -g)" "$OUT"
          else
            echo "${{ matrix.device }} não declara firmware de boot — sem imagem de cartão"
            echo "  (o rootfs.ext4 é o disco; ver docs/flashing.md)"
          fi

      - name: Write summary
        run: |
          {
            echo "## Giochi System — ${{ matrix.name }}"
            echo
            echo "- arch: \`${{ matrix.arch }}\`"
            echo "- device: \`${{ matrix.device }}\`"
            echo "- runner: \`${{ matrix.runner }}\`"
            echo
            echo "### SHA256"
            echo '```'
            cat "out/${{ matrix.device }}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giochi-system-${{ matrix.device }}
          path: out/${{ matrix.device }}
          if-no-files-found: error
          retention-days: 14

  # ── Release: o "site" onde a imagem se baixa sem mim ──────────────────────
  #
  # O artefato de Actions resolve o build, não o download: ele **exige login**
  # (`GET /actions/artifacts/<id>/zip` → 401 sem token, medido) e **expira em 14
  # dias**. Para quem quer a imagem no cartão, isso significa abrir o GitHub,
  # achar a execução certa, baixar um zip e ainda lidar com a expiração.
  #
  # Uma Release resolve as três coisas de uma vez: é uma página com o arquivo, o
  # download é anônimo em repositório público, e o link não expira. A tag é
  # **móvel** (`imagens`) para existir sempre uma só página "a mais recente" —
  # sem ela, cada build viraria uma release e a de ontem ficaria ao lado.
  release:
    name: Publicar release de imagens
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publicar_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `contents: write` só aqui, e não no topo: o resto do workflow não precisa
    # de escrita, e permissão mínima é o que limita o estrago de um passo
    # comprometido.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar os artefatos deste build
        uses: actions/download-artifact@v4
        with:
          path: baixado

      # A `.img` tem 2 GiB EXATOS (SIZE_MIB=2048), e o GitHub recusa asset de
      # 2 GiB ou mais. Comprimir não é economia: sem isto o arquivo que o usuário
      # precisa — o que se grava no cartão — ficaria de fora. O `flash-sd.sh` e
      # o `flash-dd.sh` aceitam `.gz` justamente por causa disto.
      # NOME DE ASSET É ÚNICO numa release, e o `--clobber` não avisa: ele
      # SOBRESCREVE. Com três aparelhos, `build-info.txt`, `SHA256SUMS`, `Image`,
      # `device.json` e `rootfs.ext4` existem nos três — o último upload vence e
      # a release passa a mostrar o build-info de UM aparelho como se fosse de
      # todos. Ninguém descobre isso por log: o upload sai com sucesso.
      #
      # Por isso tudo vai para uma pasta plana com o aparelho no nome. A imagem
      # de cartão é a exceção porque já nasce única.
      - name: Comprimir e renomear para não colidir entre aparelhos
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf publicar && mkdir -p publicar

          # `cp -f` SOBRESCREVE sem avisar, e uma pasta plana nunca teria dois
          # arquivos com o mesmo nome — então uma checagem de duplicata feita
          # DEPOIS do laço é decorativa: ela não pode disparar. A colisão
          # acontece no `cp`, e é ali que tem de ser recusada. (A primeira
          # versão deste passo fazia `uniq -d` no fim; verificado que o guarda
          # nunca dispara, e o arquivo era silenciosamente substituído.)
          # A função só CHECA, e não devolve o caminho: chamada em `$(...)` ela
          # rodaria num subshell, e `exit 1` ali dentro mata o subshell — não o
          # script. Medido: a checagem disparava, o `cp` seguia com destino vazio
          # e o operador via "cp: cannot create regular file ''", que não diz
          # nada sobre o problema real.
          checa() {
            if [ -e "publicar/$1" ]; then
              echo "ERRO: dois aparelhos produziriam o asset '$1'." >&2
              echo "       A release mostraria o arquivo de um como se fosse de" >&2
              echo "       todos, e o upload sairia com sucesso." >&2
              exit 1
            fi
          }

          for dir in baixado/*/; do
            aparelho="$(basename "$dir")"
            aparelho="${aparelho#giochi-system-}"
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              case "$base" in
                *.img)
                  echo "comprimindo $base ($(stat -c %s "$f") bytes)" >&2
                  checa "${base}.gz"
                  gzip -9 -c "$f" >"publicar/${base}.gz"
                  ;;
                *-sd.img.gz)
                  # Já veio comprimida e já tem o aparelho no nome.
                  checa "$base"
                  cp -f "$f" "publicar/$base"
                  ;;
                *)
                  checa "giochi-system-${aparelho}-${base}"
                  cp -f "$f" "publicar/giochi-system-${aparelho}-${base}"
                  ;;
              esac
            done
          done
          echo "--- conteúdo a publicar:"
          find publicar -type f -printf '%12s  %f\n' | sort -k2 | sed 's/^/  /'
          echo "--- total:"
          du -sh publicar | sed 's/^/  /'

      - name: Publicar na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=imagens
          commit="${{ github.sha }}"
          {
            echo "Imagens do Giochi System, geradas pelo CI a partir do commit \`${commit:0:12}\`."
            echo
            echo "**Não expiram** e o download **não exige login** (repositório público)."
            echo "A tag é móvel: a cada publicação o conteúdo desta página é substituído."
            echo
            echo "## Como gravar"
            echo
            echo '```bash'
            echo '# 1. baixe o .img.gz do seu aparelho e confira o SHA256'
            echo 'sha256sum giochi-system-<aparelho>-sd.img.gz'
            echo
            echo '# 2. grave (o script aceita .gz direto, sem descomprimir)'
            echo 'sudo bash scripts/flash-sd.sh <arquivo>.img.gz /dev/sdX --expect-gib <N>'
            echo '```'
            echo
            echo "O \`--expect-gib\` evita gravar no cartão errado quando há dois no PC"
            echo "(§12.8 do AGENTS). O tamanho que vale é o que o aparelho reporta em \`mmc info\`."
            echo
            echo "## Conteúdo"
            echo
            echo "| Arquivo | O que é |"
            echo "| --- | --- |"
            echo "| \`*-sd.img.gz\` | **a imagem para gravar no cartão** |"
            echo "| \`SHA256SUMS\` | hashes de tudo, para conferir o download |"
            echo "| \`Image\`, \`*.dtb\`, \`u-boot-rockchip.bin\` | as peças soltas, para diagnóstico |"
            echo "| \`build-info.txt\` | commit e instante do build |"
            echo
            echo "Build [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > notas.md

          # `--clobber` sobrescreve asset de mesmo nome; é o que faz a tag móvel
          # funcionar em vez de acumular arquivos de builds antigos.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notas.md --title "Imagens mais recentes"
          else
            gh release create "$TAG" --title "Imagens mais recentes" --notes-file notas.md
          fi

          # `SHA256SUMS` primeiro e o resto depois: se o upload parar no meio, o
          # que falta é a imagem, não o hash dela.
          find publicar -name '*SHA256SUMS' -print0 | xargs -0 -r -n1 gh release upload "$TAG" --clobber
          find publicar -type f ! -name '*SHA256SUMS' -print0 | xargs -0 -r -n1 gh release upload "$TAG" --clobber

          echo "### Release publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
