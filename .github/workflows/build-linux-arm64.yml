name: Build Giochi System ARM64

on:
  push:
    branches: [main]
    paths:
      - "buildroot.version"
      - "config/**"
      - "device/**"
      - "scripts/**"
      - ".github/workflows/build-linux-arm64.yml"
  workflow_dispatch:
    inputs:
      device:
        description: "ID do device ou 'all'"
        required: false
        default: "all"
        type: string
      arch:
        description: "Arquitetura alvo (arm64, x86_64 ou arm)"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
          - arm
      buildroot_version:
        description: "Versão Buildroot (vazio usa buildroot.version)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # cancel-in-progress: true — um push novo cancela o build em andamento em vez
  # de enfileirar. Com `false`, cada commit em device/ ou config/ dispara um
  # build de 3-4 h que espera o anterior terminar: a fila nunca esvazia e só o
  # último é útil. Medido em 02/11/2026: 6 builds enfileirados, nenhum com cache.
  group: giochi-system-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate device tree
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate devices
        run: node scripts/validate-devices.mjs

      - name: Run tests
        run: node tests/run-all.mjs

  discover:
    name: Discover build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build matrix
        id: matrix
        env:
          REQUESTED_DEVICE: ${{ github.event.inputs.device || 'all' }}
          REQUESTED_ARCH: ${{ github.event.inputs.arch || 'arm64' }}
        run: |
          node scripts/validate-devices.mjs
          MATRIX="$(node scripts/list-devices.mjs --github-matrix --device "$REQUESTED_DEVICE" --arch "$REQUESTED_ARCH")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matriz de build: $MATRIX"

  build:
    name: Build ${{ matrix.device }}
    needs: [validate, discover]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      GIOCHI_SYSTEM_CACHE_DIR: ${{ github.workspace }}/.cache
      GIOCHI_SYSTEM_WORK_DIR: ${{ github.workspace }}/work
      GIOCHI_SYSTEM_CCACHE_DIR: ${{ github.workspace }}/.cache/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Free disk space
        run: |
          # O runner traz ~20-25 GB de SDKs que este build não usa. Sem liberar,
          # o disco enche no meio do build (que roda 1-3 h) e ele morre sem
          # mensagem que explique a causa.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Resolve Buildroot version
        run: |
          VERSION="${{ github.event.inputs.buildroot_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(cat buildroot.version)"
          fi
          echo "BUILDROOT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Usando Buildroot $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential bzip2 ca-certificates \
            cpio curl device-tree-compiler dosfstools e2fsprogs file flex \
            gettext gperf git help2man libelf-dev libncurses-dev libssl-dev \
            libtool libudev-dev mtools parted patch perl pkg-config python3 \
            python3-dev python3-setuptools rsync swig tar texinfo unzip wget \
            xz-utils \
            ccache

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/downloads
            .cache/buildroot-dl
          # Chave ESTÁVEL (sem hashFiles). Com hash de config/device a chave muda
          # a cada commit, então TODO build é frio — baixa o Buildroot e os
          # tarballs de novo. Cache do actions é imutável: chave estável restaura
          # sempre e só salva na primeira vez.
          key: giochi-system-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}
          restore-keys: |
            giochi-system-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}-
            giochi-system-${{ matrix.device }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          # BR2_CCACHE_USE_BASEDIR torna o cache independente do caminho do
          # workspace, então ele acerta entre execuções mesmo com runner novo.
          # Também estável, e pelo mesmo motivo: chave por hash de config/
          # invalidava o ccache a cada ajuste de fragmento, então o build nunca
          # aproveitava objeto compilado. É o erro que o antecessor documentou:
          # "ccache não pagou porque a chave era hashFiles('buildroot/**')".
          key: giochi-ccache-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}
          restore-keys: |
            giochi-ccache-${{ matrix.device }}-${{ env.BUILDROOT_VERSION }}-
            giochi-ccache-${{ matrix.device }}-

      - name: Build image
        env:
          GIOCHI_SYSTEM_VERSION: ${{ github.ref_name }}-${{ github.sha }}
          ROOT_PASSWORD: ${{ secrets.GIOCHI_SYSTEM_ROOT_PASSWORD }}
        run: bash scripts/build-device.sh "${{ matrix.device }}"

      - name: Write summary
        run: |
          {
            echo "## Giochi System — ${{ matrix.name }}"
            echo
            echo "- arch: \`${{ matrix.arch }}\`"
            echo "- device: \`${{ matrix.device }}\`"
            echo "- runner: \`${{ matrix.runner }}\`"
            echo
            echo "### SHA256"
            echo '```'
            cat "out/${{ matrix.device }}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giochi-system-${{ matrix.device }}
          path: out/${{ matrix.device }}
          if-no-files-found: error
          retention-days: 14
